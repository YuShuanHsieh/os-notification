[package]
name = "notify-agent-windows"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = "0.4"
notify-agent-core = { path = "../notify-agent-core" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
# Unconditional: build-dependency target cfg is evaluated against the HOST (always
# Linux here, even when cross-compiling to Windows), so this can't be gated the same
# way the runtime `windows`/`winreg` dependencies below are. build.rs itself checks
# CARGO_CFG_TARGET_OS (the real build target) and only invokes the resource compiler
# when actually targeting Windows.
embed-resource = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Data_Xml_Dom",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.52"
