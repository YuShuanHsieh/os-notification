[package]
name = "notify-agent-windows"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = "0.4"
notify-agent-core = { path = "../notify-agent-core" }
# OpenTelemetry metrics backend (feature: OTel metrics). Deliberately NOT a
# dependency of notify-agent-core (see metrics.rs's doc comment) or of
# notify-agent-console — only this head links the OTel SDK. Not gated under
# `[target.'cfg(windows)']` like the `windows`/`winreg` crates below: unlike
# those, opentelemetry/opentelemetry-otlp compile fine on any host, and
# otel_metrics.rs's own tests (init() with telemetry disabled, init() with a
# malformed endpoint) need to run under plain `cargo test` on this Linux dev
# machine too.
opentelemetry = { version = "0.32", default-features = false, features = ["metrics"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["metrics"] }
# reqwest-blocking-client (not reqwest-client): opentelemetry_sdk's default
# PeriodicReader spawns its own OS thread and is documented as incompatible
# with async HTTP clients (reqwest-client/hyper-client) — see
# opentelemetry_sdk::metrics::PeriodicReader's doc comment. The blocking
# client still works fine called from that reader's own thread; nothing here
# runs it on a tokio worker thread.
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
    "http-proto",
    "metrics",
    "reqwest-blocking-client",
] }
# Not re-exported from the notify-agent-core path dependency, even though core
# depends on the same crates — Cargo dependencies aren't transitive across
# crate boundaries, so the settings-file JSON (de)serialization here needs its
# own direct dependency.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Same reasoning as serde/serde_json above: notify-agent-core also depends on
# sha2, but path dependencies aren't transitively exposed, so
# windows_identity.rs's own SHA-256 hashing needs a direct dependency here too.
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
# Unconditional: build-dependency target cfg is evaluated against the HOST (always
# Linux here, even when cross-compiling to Windows), so this can't be gated the same
# way the runtime `windows`/`winreg` dependencies below are. build.rs itself checks
# CARGO_CFG_TARGET_OS (the real build target) and only invokes the resource compiler
# when actually targeting Windows.
embed-resource = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Data_Xml_Dom",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authentication_Identity", # GetUserNameExW/EXTENDED_NAME_FORMAT, for the default Windows-username identity
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming", # GetUserNameW, the plain-username fallback if GetUserNameExW fails
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.52"
